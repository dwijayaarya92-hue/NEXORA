services:

  # ========================================
  # Laravel Application
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_app

    restart: unless-stopped

    ports:
      - "8099:80"

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel12
      DB_USERNAME: laravel
      DB_PASSWORD: laravel_password

    volumes:
      - laravel_storage:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy

    networks:
      - laravel_network
      - proxy


  # ========================================
  # MySQL Database
  # ========================================
  db:
    image: mysql:8.0

    container_name: laravel_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: laravel12
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]

      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - laravel_network


# ==========================================
# Volumes
# ==========================================
volumes:

  mysql_data:
    driver: local

  laravel_storage:
    driver: local


# ==========================================
# Networks
# ==========================================
networks:

  laravel_network:
    driver: bridge

  proxy:
    external: true