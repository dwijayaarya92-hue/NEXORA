services:

  # ========================================
  # Laravel Application
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8099:80"

    environment:
      APP_NAME: NEXORA
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8099

      APP_KEY: ${APP_KEY}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel12
      DB_USERNAME: laravel
      DB_PASSWORD: laravel_password

      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      SESSION_DOMAIN: null
      SESSION_SECURE_COOKIE: "false"

      CACHE_STORE: database
      QUEUE_CONNECTION: database

      FILESYSTEM_DISK: local

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: error

    volumes:
      - laravel_storage:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy

    networks:
      - laravel_network
      - proxy


  # ========================================
  # MySQL Database
  # ========================================
  db:
    image: mysql:8.0

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: laravel12
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - laravel_network


# ========================================
# Volumes
# ========================================
volumes:

  mysql_data:
    driver: local

  laravel_storage:
    driver: local


# ========================================
# Networks
# ========================================
networks:

  laravel_network:
    driver: bridge

  proxy:
    external: true